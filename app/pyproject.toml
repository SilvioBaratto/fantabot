[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantabot-app"
version = "0.1.0"
description = "Local, user-friendly web UI over fantabot — one command, no Docker."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Silvio Baratto" }]
keywords = ["fantacalcio", "fantabot", "fastapi", "angular", "local-app"]

# fantabot is a PATH dependency (see [tool.uv.sources]); both live in this repo and
# nothing is published — install is `uv tool install ./app`. Postgres ships inside the
# pixeltable-pgserver wheel (bundled PG18), so `uv` stays the only prerequisite.
dependencies = [
    "fantabot",
    "pixeltable-pgserver==0.6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "httpx"]

[project.scripts]
fantabot-app = "fantabot_app.cli:main"

# Resolve the `fantabot` dependency from the sibling repo root as an editable install.
[tool.uv.sources]
fantabot = { path = "..", editable = true }

[tool.hatch.build.targets.wheel]
# The launcher package, plus the compiled Angular bundle so end users need no Node.
#
# `artifacts` is load-bearing, not decoration: `fantabot_app/web/` is a build artifact and
# is git-ignored (app/.gitignore:286), and hatchling excludes VCS-ignored paths from the
# wheel by default. Without this line `packages` alone ships the launcher WITHOUT the UI,
# and the app serves its "frontend is not built yet" placeholder even when
# `scripts/build_frontend.py` has just staged the bundle — with no build-time error.
packages = ["fantabot_app"]
artifacts = ["fantabot_app/web/**"]

[tool.pytest.ini_options]
# One suite now that the API is a subpackage (fantabot_app.api): launcher tests plus the
# API's own tests, run together from app/ (in the app venv).
testpaths = ["tests", "fantabot_app/api/tests"]
# Default tier opens zero sockets: integration tests (real Postgres) are opt-in via
# `pytest -m integration`, matching fantabot's `-m db` discipline.
addopts = "-q -m 'not integration and not parity'"
markers = [
    "integration: exercises a real bundled Postgres (opens sockets; opt-in)",
    # The parity tier. Opt-in for the same reason `integration` is — it needs a database —
    # and separate from it because it needs a *seeded* one and answers a different
    # question: not "does the app boot" but "is the plan the page shows the plan the CLI
    # prints". A screen that answers a different question from the command is a gap the
    # operator cannot see, which is why this is a tier and not a handful of asserts.
    "parity: the CLI and the app agree on a decision (needs FANTABOT_TEST_DATABASE_URL)",
    "e2e: end-to-end tests through the running app",
    "unit: fast, isolated unit tests",
    "slow: slow-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["fantabot_app"]
# Tests are excluded from strict typing (fantabot's own convention). main.py is the
# scaffold app-factory whose endpoint defs are not yet annotated — bring it under strict
# during Phase 3 hardening, not in the rename.
exclude = ["fantabot_app/api/tests/.*", "fantabot_app/api/main\\.py"]

# These ship no py.typed marker / stubs; imported lazily inside functions.
[[tool.mypy.overrides]]
module = [
    "pixeltable_pgserver", "pixeltable_pgserver.*",
    "fantabot", "fantabot.*",
    "alembic", "alembic.*",
]
ignore_missing_imports = true
