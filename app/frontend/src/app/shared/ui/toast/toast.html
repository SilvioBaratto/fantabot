<!-- The snackbar's content.

     `ToastComponent` itself draws nothing: it presents each toast through `MatSnackBar`,
     so this markup is attached inside `mat-snack-bar-container`, out in the CDK overlay.
     A component rendered inside an overlay panel still carries its own styles, which is
     why the rules for this template live in `ToastSnackBarComponent`'s `styles` and not
     in a global sheet — only the panel around it is out of reach.

     The container supplies the M3 roles: inverse-surface behind inverse-on-surface text.
     Nothing here sets a colour except the close button, which has to opt out of the
     ordinary icon-button colour to stay legible on that inverted container. -->
<div matSnackBarLabel class="toast-label">
  @if (icon; as iconName) {
    <lucide-icon class="toast-icon" [name]="iconName" [size]="20" aria-hidden="true" />
  }
  <span class="toast-message">{{ toast.message }}</span>
</div>

<div matSnackBarActions class="toast-actions">
  <button
    matIconButton
    type="button"
    class="toast-close"
    aria-label="Dismiss notification"
    (click)="dismiss()"
  >
    <lucide-icon name="x" [size]="24" aria-hidden="true" />
  </button>
</div>
