<a class="skip-link" href="#main-content" (click)="skipToMain($event)">Skip to content</a>

<!-- autosize: the container re-measures the content margin when the rail's width changes.
     It re-checks on every change detection while a side drawer is open, so it is here only
     because the collapsed/expanded toggle really does change that width. -->
<mat-sidenav-container class="shell" autosize>
  <mat-sidenav
    class="rail"
    [class.rail-expanded]="railWide()"
    [mode]="railMode()"
    [opened]="railOpened()"
    (closedStart)="closeModalRail()"
  >
    <app-nav-rail
      [items]="usesBar() ? overflowItems : navItems"
      [expanded]="railWide()"
      [showToggle]="canDockExpanded()"
      (navigated)="closeModalRail()"
      (toggleExpanded)="toggleRailExpanded()"
    />
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    @if (usesBar()) {
      <mat-toolbar class="top-bar">
        <button
          matIconButton
          type="button"
          aria-label="Open more destinations"
          [attr.aria-expanded]="modalOpen()"
          (click)="toggleModalRail()"
        >
          <lucide-icon [name]="modalOpen() ? 'X' : 'Menu'" [size]="24" aria-hidden="true" />
        </button>
        <span class="top-bar-title">fantabot</span>
      </mat-toolbar>
    }

    <main id="main-content" tabindex="-1" aria-label="Main content">
      <router-outlet />
    </main>

    @if (usesBar()) {
      <app-nav-bar [items]="barItems" />
    }
  </mat-sidenav-content>
</mat-sidenav-container>

<!-- Route announcer: visually hidden, still read out. -->
<div aria-live="polite" aria-atomic="true" class="sr-only">{{ announced() }}</div>

<div id="toast-outlet">
  <app-toast />
</div>
