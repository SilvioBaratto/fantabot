# Postgres + Adminer for the app (a host-installed CLI under cron), plus a `tests`
# service (profile `test`) that runs the full suite in Linux — where the host's
# Windows quirks (cp1252 reads, CRLF hashes, `\` path separators) do not exist.
#
# Host ports are picked to coexist with the other stacks in this workspace:
# optimizer holds 54320/18081 and clipcraft holds 5433/8090.
#
#   docker compose up -d                      # db + adminer only (test service is profiled off)
#   docker compose run --rm tests             # socket-free tier in Linux
#   docker compose run --rm tests sh -c "alembic upgrade head && pytest -q -m db"   # db tier
services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: fantabot_db
    environment:
      POSTGRES_DB: fantabot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${FANTABOT_DB_HOST_PORT:-54321}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fantabot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fantabot_network
    restart: unless-stopped

  # Adminer — database management UI
  adminer:
    image: adminer:latest
    container_name: fantabot_adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${FANTABOT_ADMINER_HOST_PORT:-18082}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fantabot_network
    restart: unless-stopped

  # Full test suite in Linux. Profiled `test` so `docker compose up` never starts it;
  # run it explicitly. The socket-free tier needs no database (the compose dep is there
  # only for the `-m db` integration tier, which reaches Postgres).
  tests:
    build: .
    image: fantabot-tests
    container_name: fantabot_tests
    profiles: ["test"]
    environment:
      # Only the db tier talks to the `db` service. The encryption key is NOT set here on
      # purpose: the image entrypoint mints a throwaway Fernet key at runtime, so no key
      # literal is committed. Set FANTABOT_ENCRYPTION_KEY in the environment to override.
      FANTABOT_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@db:5432/fantabot"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fantabot_network

volumes:
  postgres_data:

networks:
  fantabot_network:
