name: app-ci

# The fantabot-app (app/) CI: proves the no-Docker cold install on Windows, macOS and
# Linux (SPEC A1) and runs the app's test suites. Path-filtered so it is independent of
# fantabot's own ci.yml.
#
# The filter also names four files under `src/`, and they are not arbitrary. This is the
# only workflow with a Windows runner, and the app supervises a `fantabot` child process:
# the modules on that path are exercised *here* and nowhere else. `app/**` alone meant a
# change to `adapters/files/lock.py` — the very file whose Windows backend was in
# question — never triggered the one job that runs it. `src/**` would be the other
# extreme and would run this matrix on every commit, which is what the path filter exists
# to avoid.

# The two lists below are written out twice rather than shared through a YAML anchor:
# GitHub Actions' workflow parser does not resolve anchors, so `*watched` would be read
# as a literal and silently match nothing.

on:
  push:
    branches: [main, development, feat/fantabot-app]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
      # The OS-specific halves of the supervised-child path, all unverifiable anywhere
      # else in this repository.
      - "src/fantabot/adapters/files/lock.py"
      - "src/fantabot/adapters/files/stopflag.py"
      # The child the supervisor actually spawns, and the loop that polls the flag.
      - "src/fantabot/interface/harvest.py"
      - "src/fantabot/application/harvest_supervisor.py"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
      - "src/fantabot/adapters/files/lock.py"
      - "src/fantabot/adapters/files/stopflag.py"
      - "src/fantabot/interface/harvest.py"
      - "src/fantabot/application/harvest_supervisor.py"

# Same block ci.yml has and this one lacked: a push on top of a push left the first
# matrix running, and this matrix is three OSes plus a real Postgres provision.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cold install: no Docker, no pre-installed Postgres — uv resolves the locked wheels
      # (Postgres ships inside pixeltable-pgserver).
      - name: uv sync (from uv.lock)
        run: uv sync --extra dev

      - name: Backend tests (default tier — zero sockets)
        run: uv run pytest

      # A1 proof: provision the real bundled Postgres, connect, stop.
      - name: Integration (real bundled Postgres, no Docker)
        run: uv run pytest -m integration

      - name: Lint + types
        run: |
          uv run ruff check fantabot_app tests
          uv run mypy fantabot_app

  # The parity tier: the CLI and the app, in one process, against one seeded database.
  # Beside `integration` rather than inside the matrix — it needs a *migrated* Postgres,
  # and proving the no-Docker cold install on three OSes is a different question from
  # proving the page shows the plan the command prints.
  #
  # A `postgres:16-alpine` service rather than the bundled server, matching `ci.yml`'s
  # `test-db` job: provisioning pgserver here would test the provisioner twice and the
  # parity once.
  parity:
    name: parity (CLI vs app, one database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fantabot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fantabot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Both, and for `tests/conftest.py`'s reason: the tier refuses to run when the two
      # resolve to the same database *name*, so pointing only one of them would either be
      # rejected or — worse, unset — fall back to a bundled socket no runner has.
      FANTABOT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/fantabot
      FANTABOT_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/fantabot_test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: uv sync (from uv.lock)
        working-directory: app
        run: uv sync --extra dev
      # The CLI's own toolchain, for alembic. The app depends on `fantabot` as a path
      # install, but the migrations are driven from the repository root.
      - run: pip install -e ".[dev]"
      - name: throwaway encryption key
        run: |
          KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          echo "FANTABOT_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"
      - name: create the tier's own database
        run: psql "postgresql://postgres:postgres@localhost:5432/fantabot" -c "CREATE DATABASE fantabot_test"
      - name: alembic upgrade head (the tier's database)
        run: alembic upgrade head
        env:
          FANTABOT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/fantabot_test
      - name: pytest -m parity
        working-directory: app
        run: uv run pytest -m parity

  frontend:
    name: frontend + wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Frontend tests
        working-directory: app/frontend
        run: |
          # `--legacy-peer-deps`, the same flag `scripts/build_frontend.py` passes and the
          # standing convention for every Angular app in this workspace. Plain `npm ci`
          # fails here with "Missing: @emnapi/wasi-threads@... from lock file" — a
          # transitive optional dependency of a platform-specific package, in step under
          # the resolution `npm install` uses and out of step under the strict one.
          npm ci --legacy-peer-deps
          npx ng test --watch=false

      # Build the SPA into fantabot_app/web, then confirm the wheel ships it (no Node for
      # end users).
      - name: Build frontend into the wheel
        run: python scripts/build_frontend.py

      - name: Build wheel and assert the frontend is bundled
        run: |
          uv build --wheel
          python - <<'PY'
          import glob, zipfile, sys
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("fantabot_app/web/index.html") for n in names), "web/index.html not in wheel"
          print("ok:", wheel, "bundles the compiled frontend")
          PY
