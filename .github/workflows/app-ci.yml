name: app-ci

# The fantabot-app (app/) CI: proves the no-Docker cold install on Windows, macOS and
# Linux (SPEC A1) and runs the app's test suites. Path-filtered so it is independent of
# fantabot's own ci.yml.
#
# The filter also names four files under `src/`, and they are not arbitrary. This is the
# only workflow with a Windows runner, and the app supervises a `fantabot` child process:
# the modules on that path are exercised *here* and nowhere else. `app/**` alone meant a
# change to `adapters/files/lock.py` — the very file whose Windows backend was in
# question — never triggered the one job that runs it. `src/**` would be the other
# extreme and would run this matrix on every commit, which is what the path filter exists
# to avoid.

# The two lists below are written out twice rather than shared through a YAML anchor:
# GitHub Actions' workflow parser does not resolve anchors, so `*watched` would be read
# as a literal and silently match nothing.

on:
  push:
    branches: [main, development, feat/fantabot-app]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
      # The OS-specific halves of the supervised-child path, all unverifiable anywhere
      # else in this repository.
      - "src/fantabot/adapters/files/lock.py"
      - "src/fantabot/adapters/files/stopflag.py"
      # The child the supervisor actually spawns, and the loop that polls the flag.
      - "src/fantabot/interface/harvest.py"
      - "src/fantabot/application/harvest_supervisor.py"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
      - "src/fantabot/adapters/files/lock.py"
      - "src/fantabot/adapters/files/stopflag.py"
      - "src/fantabot/interface/harvest.py"
      - "src/fantabot/application/harvest_supervisor.py"

# Same block ci.yml has and this one lacked: a push on top of a push left the first
# matrix running, and this matrix is three OSes plus a real Postgres provision.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cold install: no Docker, no pre-installed Postgres — uv resolves the locked wheels
      # (Postgres ships inside pixeltable-pgserver).
      - name: uv sync (from uv.lock)
        run: uv sync --extra dev

      - name: Backend tests (default tier — zero sockets)
        run: uv run pytest

      # A1 proof: provision the real bundled Postgres, connect, stop.
      - name: Integration (real bundled Postgres, no Docker)
        run: uv run pytest -m integration

      # The Python half of exactly what `39e2287` fixed on the frontend, and it was
      # hiding in this very step. It has run since `9688290` and was green the whole time
      # over 41 real findings: `app/pyproject.toml` declared `[tool.ruff]` with a line
      # length and **no `[tool.ruff.lint]`**, so ruff fell back to its own default
      # `E4,E7,E9,F`. `line-length = 100` was decorative (`E501` unselected), `I`, `UP`,
      # `B`, `SIM` and `RUF` were never asked, and 21 `# noqa` directives in the package
      # suppressed rules nothing selected. The config now carries the library's set plus
      # `BLE`/`DTZ`; this step is what makes a regression in it visible.
      #
      # Its own step rather than appended to the test line, so a red run says which of the
      # two failed — the same shape as the frontend lint step below.
      - name: Lint + types
        # Explicit, because this job is a three-OS matrix and the Windows runner's default
        # shell is `pwsh`, where none of the assertions below parse.
        shell: bash
        run: |
          # `set -e` explicitly: GitHub's bash is already `bash -e`, but the floors below
          # are only guards if a non-zero exit from them stops the step, and that must not
          # depend on a default one `shell:` line can change.
          set -e
          # Prove both tools are reading the tree before trusting either verdict. A dead
          # `select`, an `exclude` that swallows the package, and a genuinely clean tree
          # all print one green line, and telling them apart afterwards is the entire
          # defect this step was found to have. 101 Python files and 42 mypy modules on
          # 2026-09-24; the floors sit below both, so adding files is free and deleting a
          # root is not.
          # `tr` because BSD `wc` pads its count with leading spaces.
          FILES=$(uv run ruff check . --show-files | wc -l | tr -d '[:space:]')
          if [ "$FILES" -lt 90 ]; then
            echo "ruff saw only $FILES files — its include/exclude matches (almost) nothing"
            exit 1
          fi
          echo "ruff saw $FILES files"

          # `.` and not `fantabot_app tests`: that pair silently skipped `conftest.py` —
          # the file holding the canonical-database refusal — and all of `scripts/`.
          # Ruff's own defaults keep `.venv/`, `frontend/` and the built `fantabot_app/web/`
          # out, so `.` is narrower than it looks.
          uv run ruff check .

          # Captured rather than piped: a pipeline's exit status is the last command's, so
          # `mypy | tee` would report tee's success and swallow a type error under `set -e`.
          if ! MYPY_OUT=$(uv run mypy fantabot_app); then
            echo "$MYPY_OUT"
            exit 1
          fi
          echo "$MYPY_OUT"
          MODULES=$(printf '%s' "$MYPY_OUT" |
            sed -n 's/.*no issues found in \([0-9][0-9]*\) source file.*/\1/p')
          if [ "${MODULES:-0}" -lt 35 ]; then
            echo "mypy checked only ${MODULES:-0} modules — its exclude is eating the package"
            exit 1
          fi

  # The parity tier: the CLI and the app, in one process, against one seeded database.
  # Beside `integration` rather than inside the matrix — it needs a *migrated* Postgres,
  # and proving the no-Docker cold install on three OSes is a different question from
  # proving the page shows the plan the command prints.
  #
  # A `postgres:16-alpine` service rather than the bundled server, matching `ci.yml`'s
  # `test-db` job: provisioning pgserver here would test the provisioner twice and the
  # parity once.
  parity:
    name: parity (CLI vs app, one database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fantabot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fantabot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Both, and for `tests/conftest.py`'s reason: the tier refuses to run when the two
      # resolve to the same database *name*, so pointing only one of them would either be
      # rejected or — worse, unset — fall back to a bundled socket no runner has.
      FANTABOT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/fantabot
      FANTABOT_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/fantabot_test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: uv sync (from uv.lock)
        working-directory: app
        run: uv sync --extra dev
      # The CLI's own toolchain, for alembic. The app depends on `fantabot` as a path
      # install, but the migrations are driven from the repository root.
      - run: pip install -e ".[dev]"
      - name: throwaway encryption key
        run: |
          KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          echo "FANTABOT_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"
      - name: create the tier's own database
        run: psql "postgresql://postgres:postgres@localhost:5432/fantabot" -c "CREATE DATABASE fantabot_test"
      - name: alembic upgrade head (the tier's database)
        run: alembic upgrade head
        env:
          FANTABOT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/fantabot_test
      - name: pytest -m parity
        working-directory: app
        run: uv run pytest -m parity

  frontend:
    name: frontend + wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Frontend install
        working-directory: app/frontend
        run: |
          # `--legacy-peer-deps`, the same flag `scripts/build_frontend.py` passes and the
          # standing convention for every Angular app in this workspace. Plain `npm ci`
          # fails here with "Missing: @emnapi/wasi-threads@... from lock file" — a
          # transitive optional dependency of a platform-specific package, in step under
          # the resolution `npm install` uses and out of step under the strict one.
          npm ci --legacy-peer-deps

      # The Angular half of the workspace conventions, which until 2026-09-24 nothing
      # checked: an audit found 113 files obeying all five rules and no mechanism that
      # would have noticed the first violation. `ng test` and the build are both happy
      # with `*ngIf` and `standalone: true`. What each rule maps to is written out in
      # `app/frontend/eslint.config.js`.
      #
      # Its own step, not appended to the test line, so a red run says which of the two
      # failed. Before the tests because it is the faster of the two.
      - name: Frontend lint (Angular conventions)
        working-directory: app/frontend
        run: |
          # `set -e` explicitly: GitHub's default shell is already `bash -e`, but the
          # coverage assertion below is only a guard if a non-zero exit from it stops the
          # step, and that must not depend on a default someone can change with one
          # `shell:` line.
          set -e
          # Prove the config is looking at the files before trusting its verdict: a
          # `files`/`ignores` glob that matches nothing reports zero problems and exits 0,
          # which is indistinguishable from a clean tree and is the same class of dead
          # guard this step was added to close. 97 source files on 2026-09-24 (80 `.ts`,
          # 17 `.html`); the floor is below that so adding files is free and deleting the
          # glob is not.
          npx eslint . --format json > /tmp/eslint-report.json || true
          node -e '
            const r = require("/tmp/eslint-report.json");
            const n = r.filter((f) => /\.(ts|html)$/.test(f.filePath)).length;
            if (n < 90) {
              console.error(`eslint saw only ${n} source files — its globs match (almost) nothing`);
              process.exit(1);
            }
            console.log(`eslint saw ${n} source files`);
          '
          npm run lint

      - name: Frontend tests
        working-directory: app/frontend
        run: npx ng test --watch=false

      # Build the SPA into fantabot_app/web, then confirm the wheel ships it (no Node for
      # end users).
      - name: Build frontend into the wheel
        run: python scripts/build_frontend.py

      - name: Build wheel and assert the frontend is bundled
        run: |
          uv build --wheel
          python - <<'PY'
          import glob, zipfile, sys
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("fantabot_app/web/index.html") for n in names), "web/index.html not in wheel"
          print("ok:", wheel, "bundles the compiled frontend")
          PY
