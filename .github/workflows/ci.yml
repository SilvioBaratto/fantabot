name: CI

# Runs on every push to main or development, and on PRs targeting them. The suite is Linux-
# green on a fresh checkout (the host-Windows quirks — cp1252 reads, CRLF hashes, `\` paths —
# do not exist here), so this gate is expected to pass every time.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# A newer push to the same ref cancels the older run — no point finishing a superseded commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this pipeline only reads the code and runs tests. Nothing here needs write.
permissions:
  contents: read

jobs:
  lint-and-type:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: mypy (strict, src only)
        run: mypy

  test:
    name: pytest (socket-free tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # A throwaway Fernet key for the run — minted, never committed. No real credential.
      - name: throwaway encryption key
        run: |
          KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          echo "FANTABOT_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"
      # Scoped to `tests/`, and not decoration: the root pyproject sets no `testpaths`,
      # so a bare `pytest` collects app/fantabot_app/api/tests and app/tests/test_server.py,
      # which import fastapi. This environment does not have it — the app has its own venv,
      # and `app-ci` is where the app's suite runs. Both tiers errored at collection with
      # zero tests run for as long as the app has had tests. `testpaths` would fix it and
      # would also silence the integration/e2e marker declarations that exist *because* a
      # root run collects app/, so the scoping goes here. Same fix as scripts/gate.sh.
      - name: pytest
        run: pytest -q tests/

  test-db:
    name: pytest (db integration tier)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fantabot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fantabot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FANTABOT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/fantabot
      # A database of its own, and not a nicety: `tests/conftest.py` refuses to run the
      # tier against the canonical database *by name alone*, so pointing both variables
      # at `fantabot` would be rejected rather than accepted. Unset, the tier falls back
      # to the bundled server's DSN — a unix socket no runner has ever provisioned, which
      # is what `connection to server on socket
      # "/home/runner/.fantabot/pgdata/.s.PGSQL.5432" failed` was.
      FANTABOT_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/fantabot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: throwaway encryption key
        run: |
          KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          echo "FANTABOT_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"
      - name: create the tier's own database
        run: psql "postgresql://postgres:postgres@localhost:5432/fantabot" -c "CREATE DATABASE fantabot_test"

      - name: alembic upgrade head
        run: alembic upgrade head
      - name: alembic check (models and migrations agree)
        run: alembic check

      # The tier's database needs the schema too — `alembic check` is about the canonical
      # one, and the tests write into this one.
      - name: alembic upgrade head (the tier's database)
        run: alembic upgrade head
        env:
          FANTABOT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/fantabot_test

      # `not dbdata`, and that exclusion is the whole reason this step can pass. 100 of
      # the 159 `db` tests carry the `dbdata` marker: they assert against 614,163 rows
      # that have actually been scraped, harvested and synced, and there is no fixture
      # for them — `tests/conftest.py` points them at the canonical database on purpose.
      # A runner has no corpus, so running them here would fail on every one for a reason
      # that is not a defect. The remaining 59 need a schema and nothing more.
      #
      # None of this was visible until now: the step errored at collection on `fastapi`
      # for as long as the app has had tests, so it never reached a database at all.
      - name: pytest -m "db and not dbdata"
        run: pytest -q -m "db and not dbdata" tests/
