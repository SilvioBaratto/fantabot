[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantabot"
version = "0.1.0"
description = "100% autonomous fantacalcio manager for leghe.fantacalcio.it"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "playwright>=1.45",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "claude-agent-sdk>=0.2.143",
    "sqlalchemy>=2.0.50",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "cryptography>=45",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # ruff and mypy are pinned to a patch band (~=): a new minor can add a lint rule or tighten
    # a check and turn CI red with no code change, which would break the "green every time"
    # promise. Bump these deliberately (Dependabot), not implicitly.
    "ruff~=0.16.5",
    "mypy~=2.3.1",
]

[project.scripts]
fantabot = "fantabot.interface.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fantabot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# This repository holds two suites and they are not one run: `tests/` is the library's and
# runs from here; the app's is `cd app && uv run pytest`, against its own venv at
# `app/.venv`. Without `testpaths` a bare `pytest` from the root collected both, and that
# failed two ways. In CI the conda/pip env has no fastapi, so collection errored before a
# test ran. Locally it *worked*, and did something worse: neither tree is a package, so a
# `conftest.py` is imported under its bare basename, `app` sorts before `tests`, and
# `app/conftest.py` took the module name `conftest` — which is what
# `tests/test_integration_isolation.py` then got when it imported `refuse_canonical` by
# that name. Three tests of the canonical-database guard failed at collection in every
# full run and passed when run alone. `tests/test_suite_scope.py` pins both halves.
testpaths = ["tests"]
# The default run must open zero sockets, so the integration tier is opt-in.
# A command-line -m overrides this value, because the last -m wins.
addopts = "-m 'not db and not integration'"
markers = [
    "db: requires a live Postgres (fantabot-app db start)",
    # A subset of `db`. The rest of the tier writes synthetic rows into a database that
    # needs only a schema; these read what has actually been scraped, harvested and
    # synced, so they run against the canonical database. See tests/conftest.py.
    "dbdata: a `db` test that reads the seeded corpus, not just the schema",
    # Both are the app's and neither is used under `tests/`. They no longer keep the
    # default run's "zero sockets" promise — `testpaths` does, by not collecting `app/` at
    # all — but naming an app path explicitly from the root stays legal, and an undeclared
    # mark is a warning on every item it is collected on.
    "integration: the app launcher against a real bundled Postgres (opens sockets)",
    "e2e: end-to-end, through a running fantabot-app",
]
# An exception in a worker thread is a *warning*, not a failure: a test that starts a thread
# which raises passes green. The socket guard in conftest.py raises, so once anything in this
# repo does work on a thread — the live room's copilot does — "zero sockets" becomes
# unprovable exactly where it is asserted. Measured: the probe went 1 passed -> 1 failed.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
