[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantabot"
version = "0.1.0"
description = "100% autonomous fantacalcio manager for leghe.fantacalcio.it"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "playwright>=1.45",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "claude-agent-sdk>=0.2.143",
    "sqlalchemy>=2.0.50",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "cryptography>=45",
    "pyjwt>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
fantabot = "fantabot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fantabot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Every script inserts its own parent on sys.path before importing `_db`, which
# is a sibling module rather than a package. That puts imports after a
# statement. Ruff does not currently raise E402 there, so the `# noqa: E402`
# comments that used to carry this were flagged as unused and removed — leaving
# nothing to state the intent. This is that statement, and it survives a ruff
# version that starts raising it.
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# The default run must open zero sockets, so the integration tier is opt-in.
# A command-line -m overrides this value, because the last -m wins.
addopts = "-m 'not db'"
markers = ["db: requires a live Postgres (docker compose up -d)"]
